name: index-lab

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    # Настройки зафиксированы, чтобы планы были одинаковыми у всех.
    # Не меняйте их: от них зависят пороги в check.yaml.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=4
      - -c
      - effective_cache_size=1GB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - jit=off
      - -c
      - autovacuum=off
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_wal_size=4GB
      - -c
      - timezone=UTC
    ports:
      - "${LAB_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  lab:
    build: ./runner
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: lab
      PGPASSWORD: lab
      PGDATABASE: lab
      LAB_ROOT: /lab
    volumes:
      - .:/lab
    working_dir: /lab
    entrypoint: ["python3", "/lab/runner/lab.py"]
    profiles: ["tools"]

volumes:
  pgdata:
